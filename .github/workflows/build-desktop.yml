# Build the GhostIDE desktop packages (Roadmap G18).
# Manual trigger only: Actions tab, "Build desktop
# packages", Run workflow. Produces one artifact per OS.
name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: bash packaging/build-linux.sh
            artifact: packaging/GhostIDE-linux.tar.gz
          - os: macos-latest
            script: bash packaging/build-macos.sh
            artifact: packaging/GhostIDE-macos.tar.gz
          - os: windows-latest
            script: ./packaging/build-windows.ps1
            artifact: packaging/GhostIDE-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build package
        shell: bash
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ghostide-${{ matrix.os }}
          path: ${{ matrix.artifact }}
